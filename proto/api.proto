syntax = "proto3";

package proto_api;

import "common.proto";
import "request.proto";
import "response.proto";

service ApiService {
  rpc List (Pagination) returns (GetListResponse);
  rpc One (GetUserOneRequest) returns (UserResponse);
  rpc Register (RegisterUserRequest) returns (UserResponse);
  rpc Edit (EditUserRequest) returns (UserResponse);
  rpc Login (LoginRequest) returns (AuthBodyResponse);
}

