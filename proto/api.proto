syntax = "proto3";

package proto_api;

import "common.proto";
import "request.proto";
import "response.proto";

service ApiService {
  rpc List (Pagination) returns (ListResponse);
  rpc One (GetUserOneRequest) returns (UserOneResponse);
  rpc Register (RegisterUserRequest) returns (UserOneResponse);
  rpc Edit (EditUserRequest) returns (UserOneResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
}

